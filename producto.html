<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Producto | Origen Fit</title>
<meta name="description" content="Detalle de producto Origen Fit">
<style>
:root{--red:#e30613;--dark:#111;--line:#e7e7e9;--muted:#686970}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:#111;background:#fff}a{text-decoration:none;color:inherit}.c{width:min(1160px,calc(100% - 30px));margin:auto}.head{background:var(--red);padding:15px 0}.headin{display:flex;justify-content:space-between;align-items:center;gap:16px}.logo{width:min(260px,65vw);max-height:52px;object-fit:contain}.back{color:#fff;font-weight:900}.main{padding:48px 0 70px}.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:48px;align-items:start}.grid>div,.info{min-width:0}.info{width:100%;max-width:100%}
.main-photo{width:100%;min-height:520px;border:1px solid var(--line);border-radius:24px;background:#fafafa;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:24px}.main-photo img{display:block;width:auto;height:auto;max-width:100%;max-height:680px;object-fit:contain;object-position:center}
.thumbs{display:flex;gap:10px;overflow:auto;margin-top:12px;padding-bottom:4px}.thumb{width:88px;height:88px;flex:none;border:2px solid transparent;border-radius:12px;background:#fff;padding:5px;cursor:pointer}.thumb.active{border-color:var(--red)}.thumb img{width:100%;height:100%;object-fit:contain}.kicker{color:var(--red);font-weight:950;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}.info h1{font-size:clamp(2.4rem,5vw,4rem);line-height:.95;letter-spacing:-.055em;margin:10px 0 14px;overflow-wrap:anywhere}.brand{color:var(--muted);font-weight:800;overflow-wrap:anywhere}.price{font-size:2rem;color:var(--red);font-weight:950;margin:22px 0 5px}.old{color:#8b8d93;text-decoration:line-through;font-weight:800}.promo-label{display:inline-block;margin-top:7px;color:#555861;font-size:.86rem;font-weight:900;overflow-wrap:anywhere}.flags{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.flag{display:inline-flex;border-radius:999px;padding:7px 11px;font-size:.8rem;font-weight:950;background:#111;color:#fff}.flag.out{background:#f3dfe1;color:#9b2028}.flag.ship{background:#e9f7ef;color:#14743a}
.flavor-box{margin:22px 0 6px}.flavor-title{font-size:.93rem;margin-bottom:10px;color:#333}.flavor-title strong{color:#111}.flavor-options{display:flex;gap:9px;flex-wrap:wrap}.flavor-btn{border:1.5px solid #cfd0d4;background:#fff;color:#222;border-radius:10px;padding:10px 14px;font-weight:850;cursor:pointer;transition:.15s}.flavor-btn:hover{border-color:#999}.flavor-btn.active{border-color:var(--red);box-shadow:0 0 0 2px rgba(227,6,19,.12);color:var(--red)}.flavor-empty{color:#9b2028;font-weight:850;font-size:.88rem}
.desc{width:100%;max-width:100%;font-size:1.03rem;line-height:1.65;color:#45474e;white-space:pre-wrap;margin:24px 0;overflow-wrap:anywhere;word-break:break-word}.actions{display:grid;gap:10px;margin-top:24px;width:100%}.btn{border:0;border-radius:999px;padding:14px 18px;font-weight:950;font-size:1rem;cursor:pointer}.cart{background:var(--red);color:#fff}.cart:disabled{background:#ddd;color:#777;cursor:not-allowed}.wa{background:#111;color:#fff;text-align:center}.msg{padding:24px;border-radius:16px;background:#f6f6f7;color:#555}.placeholder{font-size:2rem;font-weight:950;color:#aaa}.zoom-note{color:var(--muted);font-size:.82rem;margin-top:8px}
@media(max-width:820px){.main{padding-top:28px}.grid{grid-template-columns:1fr;gap:26px}.main-photo{min-height:400px;padding:18px}.main-photo img{max-height:68vh}}
@media(max-width:520px){.main-photo{min-height:310px;padding:12px}.main-photo img{max-height:62vh}.thumb{width:72px;height:72px}.headin{justify-content:center}.back{display:none}.flavor-btn{padding:9px 12px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body data-product-detail="1">
<header class="head"><div class="c headin"><a class="back" href="index.html">← Volver a la tienda</a><a href="index.html"><img class="logo" src="logo-principal.png" alt="Origen Fit"></a><span></span></div></header>
<main class="main"><div class="c"><div id="loading" class="msg">Cargando producto…</div><div id="error" class="msg" style="display:none"></div><div id="product" class="grid" style="display:none">
  <div><div class="main-photo" id="mainPhoto"></div><div class="thumbs" id="thumbs"></div><div class="zoom-note">Seleccioná una miniatura para cambiar la foto principal.</div></div>
  <section class="info"><div class="kicker" id="category"></div><h1 id="name"></h1><div class="brand" id="brand"></div><div id="priceBox"></div><div class="flags" id="flags"></div><div class="flavor-box" id="flavorBox" style="display:none"><div class="flavor-title">Sabor: <strong id="flavorSelected">Seleccioná una opción</strong></div><div class="flavor-options" id="flavorOptions"></div></div><div class="desc" id="description"></div><div class="actions"><button class="btn cart" id="addCart" type="button">Agregar al carrito</button><a class="btn wa" id="whatsapp" target="_blank" rel="noopener">Consultar por WhatsApp</a></div></section>
</div></div></main>
<script>
(async()=>{
  const $=id=>document.getElementById(id),cfg=window.ORIGENFIT_CONFIG||{},client=supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey);window.db=window.db||client;
  const id=new URLSearchParams(location.search).get('id');
  if(!id){$('loading').style.display='none';$('error').style.display='block';$('error').textContent='Producto no encontrado.';return;}
  const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  try{
    const [{data:p,error:pe},{data:g,error:ge}]=await Promise.all([
      client.from('products').select('*').eq('id',id).eq('visible',true).single(),
      client.from('product_images').select('id,image_url,sort_order').eq('product_id',id).order('sort_order').order('created_at')
    ]);
    if(pe||!p)throw pe||new Error('Producto no encontrado');if(ge)console.warn(ge);
    document.title=`${p.name} | Origen Fit`;$('category').textContent=p.category||'Producto';$('name').textContent=p.name||'';$('brand').textContent=p.brand||'Origen Fit';$('description').textContent=p.description||'';

    const promo=p.promo_price!=null&&Number(p.promo_price)>0&&(p.price==null||Number(p.promo_price)<Number(p.price));
    const finalPrice=promo?Number(p.promo_price):Number(p.price||0);
    $('priceBox').innerHTML=`${promo&&p.promo_label?`<div class="promo-label">${esc(p.promo_label)}</div>`:''}<div class="price">$${finalPrice.toLocaleString('es-AR')}</div>${promo&&p.price!=null?`<div class="old">$${Number(p.price).toLocaleString('es-AR')}</div>`:''}`;
    $('flags').innerHTML=`<span class="flag ${Number(p.stock)<=0?'out':''}">${Number(p.stock)>0?`Stock disponible: ${p.stock}`:'SIN STOCK'}</span>${p.free_shipping?'<span class="flag ship">Envío gratis</span>':''}`;

    const images=[p.image_url,...(g||[]).map(x=>x.image_url)].filter(Boolean),main=$('mainPhoto'),thumbs=$('thumbs');
    if(images.length){
      const show=(url,btn)=>{main.innerHTML=`<img src="${esc(url)}" alt="${esc(p.name)}">`;thumbs.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));btn?.classList.add('active');};
      thumbs.innerHTML=images.map((url,i)=>`<button class="thumb ${i===0?'active':''}" type="button" data-url="${esc(url)}"><img src="${esc(url)}" alt=""></button>`).join('');thumbs.querySelectorAll('.thumb').forEach(btn=>btn.onclick=()=>show(btn.dataset.url,btn));show(images[0],thumbs.querySelector('.thumb'));
    }else main.innerHTML='<div class="placeholder">Origen Fit</div>';

    const flavors=Array.isArray(p.flavors)?p.flavors.map(x=>String(x||'').trim()).filter(Boolean):[];
    const flavorRequired=!!p.flavors_enabled;
    let selectedFlavor='';
    const flavorBox=$('flavorBox'),flavorOptions=$('flavorOptions'),flavorSelected=$('flavorSelected'),add=$('addCart');
    const refreshActions=()=>{
      const noStock=Number(p.stock)<=0;
      add.disabled=noStock||(flavorRequired&&!selectedFlavor);
      add.textContent=noStock?'Sin stock':flavorRequired&&!flavors.length?'Sin sabores disponibles':flavorRequired&&!selectedFlavor?'Elegí un sabor':'Agregar al carrito';
      const flavorPart=selectedFlavor?` Sabor: ${selectedFlavor}.`:'';
      $('whatsapp').href=`https://wa.me/5492216187020?text=${encodeURIComponent(`Hola! Quiero consultar por ${p.name}${p.brand?` (${p.brand})`:''}.${flavorPart}`)}`;
    };
    if(flavorRequired){
      flavorBox.style.display='block';
      if(flavors.length){
        flavorOptions.innerHTML=flavors.map(x=>`<button class="flavor-btn" type="button" data-flavor="${esc(x)}">${esc(x)}</button>`).join('');
        flavorOptions.querySelectorAll('.flavor-btn').forEach(btn=>btn.onclick=()=>{
          selectedFlavor=btn.dataset.flavor||'';flavorOptions.querySelectorAll('.flavor-btn').forEach(x=>x.classList.toggle('active',x===btn));flavorSelected.textContent=selectedFlavor;refreshActions();
        });
      }else{flavorSelected.textContent='Sin opciones';flavorOptions.innerHTML='<div class="flavor-empty">No hay sabores disponibles por el momento.</div>';}
    }
    add.onclick=()=>{if(flavorRequired&&!selectedFlavor)return;window.ORIGENFIT_CART?.addProduct?.(String(p.id),selectedFlavor);};
    refreshActions();

    $('loading').style.display='none';$('product').style.display='grid';
  }catch(err){$('loading').style.display='none';$('error').style.display='block';$('error').textContent='No se pudo cargar el producto.';console.error(err);}
})();
</script>
</body>
</html>
